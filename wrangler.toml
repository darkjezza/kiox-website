# Cloudflare Worker — static Astro site + Phaser /client/ + game-server proxies.
# Build:  npm run build:live
# Deploy: npm run deploy

name = "kiox-online"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "kiox-online.spiritnetworks.org/*", zone_name = "spiritnetworks.org" },
  { pattern = "play.kiox-online.spiritnetworks.org/*", zone_name = "spiritnetworks.org" },
]

[assets]
directory = "./dist/site"
binding = "ASSETS"
# Worker must run first: play.* rewrites + /game-* proxies (assets alone cannot).
run_worker_first = true

[vars]
# Public HTTPS origin of the live game server (status + /game-api proxy).
GAME_SERVER_URL = "https://kiox-server-live.spiritnetworks.org"

[observability]
enabled = true

[observability.traces]
enabled = true
