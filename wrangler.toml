# Cloudflare Worker — Astro 7 site + Phaser client at /client/.
# Prefer deploying with: wrangler deploy --config dist/server/wrangler.json
# (generated by `astro build`). This file supplies routes + vars for local/dev.
#
# Dashboard (Root directory = website):
#   Build command:   npm ci && npm run build
#   Deploy command:  npx wrangler deploy --config dist/server/wrangler.json

name = "kiox-online"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "kiox-online.spiritnetworks.org/*", zone_name = "spiritnetworks.org" },
  { pattern = "play.kiox-online.spiritnetworks.org/*", zone_name = "spiritnetworks.org" },
]

[vars]
# Public HTTPS origin of the live game server (status + /game-api proxy).
GAME_SERVER_URL = "https://kiox-server-live.spiritnetworks.org"
